# Weekly update PRs for the Gradle dependencies (Ktor and JDA face the internet). Patches come as one PR the Friday
# run can test and take; minors as another, since some (Kotlin, AGP, the Compose BOM) act like majors; each major on
# its own, as they need real work.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      patch:
        update-types: ["patch"]
      minor:
        update-types: ["minor"]
