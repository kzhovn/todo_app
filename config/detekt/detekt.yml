# Overrides on detekt's defaults (buildUponDefaultConfig). Off: style rules this code doesn't follow (long
# one-line expressions, literal numbers, PascalCase composables) and counting functions per file, which flags
# the thin facades over :core (TaskService, TaskRepository) as much as real dumping grounds.
style:
  MaxLineLength:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    active: false
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
complexity:
  TooManyFunctions:
    active: false
  LongParameterList:
    ignoreAnnotated: ['Composable']
